[package]
name = "rea-ai"
description = "AI backends, the agent loop and crews for REA"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
schemars = { workspace = true }
rea-evidence = { workspace = true }
rea-engine = { workspace = true }
rea-engines = { workspace = true }
rea-formats = { workspace = true }
rea-platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
toml = { workspace = true }
ureq = "3"
dirs = "6"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
rea-testkit = { workspace = true }
