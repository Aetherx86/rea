[package]
name = "rea-ui-egui"
description = "The REA egui interface: Beginner and Experienced modes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[lints]
workspace = true

[dependencies]
rea-engine = { workspace = true }
rea-engines = { workspace = true }
rea-ai = { workspace = true }
rea-setup = { workspace = true }
rea-platform = { workspace = true }
egui = { workspace = true }
# SVG icons (Lucide) rasterised at the exact on-screen size with resvg (pure Rust).
egui_extras = { workspace = true, features = ["svg"] }
# `links`: without it `ctx.open_url` is a silent no-op (the workspace turns eframe's defaults off).
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "links"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native open/save dialogs, always shown from a worker thread (never blocks a frame).
rfd = { workspace = true }
# Pictures pasted from the clipboard (see `paste`).
arboard = { workspace = true }
pollster = "0.4"
# Safe, small OS-language lookup; MIT OR Apache-2.0, no native runtime dependency.
sys-locale = "0.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
# The system menu bar (a safe API over AppKit); MIT OR Apache-2.0.
muda = { version = "0.21.2", default-features = false }

[dev-dependencies]
rea-testkit = { workspace = true }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot", "eframe"] }
tempfile = "3"
