allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# Locks must be able to notice a deadlock and get out of it; see crates/platform/src/sync.rs.
disallowed-types = [
    { path = "std::sync::Mutex", reason = "use rea_platform::sync::Mutex, which can't hang" },
    { path = "std::sync::MutexGuard", reason = "use rea_platform::sync::MutexGuard" },
]
