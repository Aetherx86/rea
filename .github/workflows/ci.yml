name: CI Safety & Quality Pipeline

on:
  push:
    tags: ["v*.0.0"]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact qualification source; must match the caller revision.
        required: false
        type: string
        default: ""
      remote_cache_write:
        description: Trusted release qualification may publish the remote cache.
        required: false
        type: boolean
        default: false
    secrets:
      TURBO_TOKEN:
        description: Remote cache token. Only trusted release qualification passes it.
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===========================================================================
  # 1. Security & Safety: Secret Scanning and Repository Hygiene
  # ===========================================================================
  security-audit:
    name: Security & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Repository Hygiene & Conflict Marker Verification
        run: |
          echo "Scanning for unresolved git conflict markers..."
          ! git grep -nE '^<{7}( |$)|^={7}$|^>{7}( |$)' -- ':!*.pdf' ':!*.png' ':!*.jpg' ':!*.mp4' || (echo "Error: Unresolved conflict markers found" && exit 1)
          echo "Repository hygiene check completed successfully."

  # ===========================================================================
  # 2. REA TypeScript, Lint & Boundary Tests Workflow
  # ===========================================================================
  rea-node-workflow:
    name: REA TypeScript, Lint & Boundary Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and Lint
        run: npm run check:fast

      - name: Compile Runtime
        run: npm run compile

      - name: Disassembly Boundary Tests
        run: npx vitest run tests/boundary/cli/disassembleCli.test.ts

  # ===========================================================================
  # 3. Rust Quality & Security Workflow
  # ===========================================================================
  rust-workflow:
    name: Rust Quality, Tests & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Check Cargo.toml presence
        id: check_cargo
        run: |
          if find . -name "Cargo.toml" -not -path "*/node_modules/*" -not -path "*/target/*" | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Cargo.toml files found. Skipping Rust steps."
          fi

      - name: Set up Rust Toolchain
        if: steps.check_cargo.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux Desktop Libraries
        if: steps.check_cargo.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev pkg-config

      - name: Cache Cargo Dependencies
        if: steps.check_cargo.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        if: steps.check_cargo.outputs.present == 'true'
        uses: taiki-e/install-action@cargo-audit

      - name: Rust Formatting Check (cargo fmt)
        if: steps.check_cargo.outputs.present == 'true'
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo fmt --all -- --check
          else
            find . -name "Cargo.toml" -not -path "*/target/*" -execdir cargo fmt --all -- --check \;
          fi

      - name: Rust Linter Check (cargo clippy)
        if: steps.check_cargo.outputs.present == 'true'
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo clippy --workspace --all-targets --all-features -- -D warnings
          else
            find . -name "Cargo.toml" -not -path "*/target/*" -execdir cargo clippy --all-targets --all-features -- -D warnings \;
          fi

      - name: Rust Tests (cargo test)
        if: steps.check_cargo.outputs.present == 'true'
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo test --workspace --all-targets --all-features
          else
            find . -name "Cargo.toml" -not -path "*/target/*" -execdir cargo test --all-targets --all-features \;
          fi

      - name: Rust Vulnerability Audit (cargo audit)
        if: steps.check_cargo.outputs.present == 'true'
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo audit
          else
            find . -name "Cargo.toml" -not -path "*/target/*" -execdir cargo audit \;
          fi

  # ===========================================================================
  # 4. Docker Quality & Vulnerability Workflow
  # ===========================================================================
  docker-workflow:
    name: Docker Lint, Build & Trivy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Check Dockerfile presence
        id: check_docker
        run: |
          if find . -name "Dockerfile*" -not -path "*/node_modules/*" | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile found. Skipping Docker steps."
          fi

      - name: Lint Dockerfile (Hadolint)
        if: steps.check_docker.outputs.present == 'true'
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          ignore: DL3008,DL3013
          failure-threshold: error

      - name: Set up Docker Buildx
        if: steps.check_docker.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        if: steps.check_docker.outputs.present == 'true'
        run: |
          if [ -f "Dockerfile" ]; then
            docker build -t ci-test-image:latest -f Dockerfile .
          else
            FIRST_DF=$(find . -name "Dockerfile*" -not -path "*/node_modules/*" | head -n 1)
            CONTEXT_DIR=$(dirname "$FIRST_DF")
            docker build -t ci-test-image:latest -f "$FIRST_DF" "$CONTEXT_DIR"
          fi

      - name: Container Security Scan (Trivy)
        if: steps.check_docker.outputs.present == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ci-test-image:latest"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
