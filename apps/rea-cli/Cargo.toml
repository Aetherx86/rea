[package]
name = "rea-cli"
description = "REA on the command line: every tool, the MCP server, setup and doctor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rea-engine = { workspace = true }
rea-engines = { workspace = true }
rea-evidence = { workspace = true }
rea-formats = { workspace = true }
rea-disasm = { workspace = true }
rea-analysis = { workspace = true }
rea-platform = { workspace = true }
rea-mcp = { workspace = true }
rea-ai = { workspace = true }
rea-setup = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }

[features]
wasm-plugins = ["rea-engine/wasm-plugins"]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
# The DPI-aware manifest for rea-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"
